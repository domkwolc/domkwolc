<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dominik Kwolczak</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Use the Inter font family */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Style for the active language button */
        .lang-btn.active {
            background-color: #475569; /* slate-600 */
            color: white;
        }
    </style>
</head>
<body class="bg-stone-100 text-stone-800 flex items-center justify-center min-h-screen transition-colors duration-300">

    <div class="container mx-auto p-6 text-center max-w-lg">
        
        <!-- Language Switcher -->
        <div class="flex justify-center space-x-2 mb-8">
            <button id="lang-en" class="lang-btn text-sm font-medium py-2 px-4 rounded-lg transition-colors duration-200 hover:bg-stone-200 active">EN</button>
            <button id="lang-pl" class="lang-btn text-sm font-medium py-2 px-4 rounded-lg transition-colors duration-200 hover:bg-stone-200">PL</button>
        </div>

        <!-- Profile Picture -->
        <!-- Updated with your new photo -->
        <img src="ZdjecieProfilowe.png" 
             alt="A photo of Dominik"
             class="w-32 h-32 rounded-full mx-auto mb-6 shadow-md object-cover">

        <!-- Main Heading -->
        <h1 id="main-heading" class="text-4xl md:text-5xl font-bold text-stone-900">
            Hi, I'm Dominik
        </h1>

        <!-- Subheading -->
        <p id="subheading" class="text-md md:text-lg text-stone-600 mt-2">
            A Life-long learner, IT Specialist, Blogger and Coffeeholic.
        </p>
        
        <!-- Links -->
        <div class="mt-8 flex flex-col sm:flex-row justify-center items-center space-y-4 sm:space-y-0 sm:space-x-4">
            <a id="link-blog" href="https://techwithdom.com" target="_blank" rel="noopener noreferrer"
               class="w-full sm:w-auto bg-slate-600 text-white font-medium py-3 px-6 rounded-lg shadow-md hover:bg-slate-700 transition-transform transform hover:scale-105">
                My Blog
            </a>
            <a id="link-social" href="https://beacons.ai/techwithdom" target="_blank" rel="noopener noreferrer"
               class="w-full sm:w-auto bg-slate-800 text-white font-medium py-3 px-6 rounded-lg shadow-md hover:bg-slate-900 transition-transform transform hover:scale-105">
                Social Media
            </a>
        </div>
    </div>

    <script>
        // --- Language Translation Logic ---

        // Object containing all text content for different languages
        const translations = {
            en: {
                mainHeading: "Hi, I'm Dominik",
                subheading: "A Life-long learner, IT Specialist, Blogger and Coffeeholic.",
                linkBlog: "My Blog",
                linkSocial: "Social Media"
            },
            pl: {
                mainHeading: "Cześć, jestem Dominik",
                subheading: "Pasjonat nauki, Informatyk, Bloger i Kawosz.",
                linkBlog: "Mój Blog",
                linkSocial: "Media Społecznościowe"
            }
        };

        // Get references to the HTML elements that need to be translated
        const mainHeadingEl = document.getElementById('main-heading');
        const subheadingEl = document.getElementById('subheading');
        const linkBlogEl = document.getElementById('link-blog');
        const linkSocialEl = document.getElementById('link-social');
        const langEnBtn = document.getElementById('lang-en');
        const langPlBtn = document.getElementById('lang-pl');

        /**
         * Function to switch the language of the page content.
         * @param {string} lang - The language to switch to ('en' or 'pl').
         */
        const switchLanguage = (lang) => {
            // Get the translated text for the selected language
            const content = translations[lang];

            // Update the content of the elements
            mainHeadingEl.textContent = content.mainHeading;
            subheadingEl.textContent = content.subheading;
            linkBlogEl.textContent = content.linkBlog;
            linkSocialEl.textContent = content.linkSocial;
            
            // Update the active state of the language buttons
            if (lang === 'en') {
                langEnBtn.classList.add('active');
                langPlBtn.classList.remove('active');
            } else if (lang === 'pl') {
                langPlBtn.classList.add('active');
                langEnBtn.classList.remove('active');
            }
        };

        // Add click event listeners to the language buttons
        langEnBtn.addEventListener('click', () => switchLanguage('en'));
        langPlBtn.addEventListener('click', () => switchLanguage('pl'));

        // Set the default language when the page loads
        // You could also add logic here to detect the user's browser language
        switchLanguage('en');

    </script>
</body>
</html>
